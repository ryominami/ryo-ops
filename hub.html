<script>
(function () {
  var data = JSON.parse(document.getElementById("hub-data").textContent);
  var services = data.services || [];

  document.getElementById("hub-meta").textContent =
    "更新: " + data.built_at + " ・ stale閾値 " + data.stale_days + "日" +
    (data.domain ? " ・ domain: " + data.domain : "");

  var GROUPS = [
    { key: "active", label: "🟢 稼働", match: function (s) { return s.status === "active"; } },
    { key: "attention", label: "⚠️ 要注意", match: function (s) { return s.status === "attention" || s.status === "orphan"; } },
    { key: "paused", label: "⏸ 休止", match: function (s) { return s.status === "paused"; } },
    { key: "local", label: "💻 ローカル", match: function (s) { return s.status === "local"; } }
  ];

  var HOST_LABEL = {
    "github-pages": "GitHub Pages",
    "cf-pages": "CF Pages",
    "cf-workers": "CF Workers",
    "r2": "R2",
    "local": "local"
  };
  var AUTH_LABEL = {
    "none": null,
    "password": "🔒 password",
    "token": "🔑 token",
    "cf-access": "🛡 cf-access"
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function auditBadge(s) {
    if (!s.last_status) return "";
    var cls = "audit-ok";
    if (/NG|timeout|not found|unreachable|unauthorized/i.test(s.last_status)) cls = "audit-ng";
    else if (/warn|530|stale/i.test(s.last_status)) cls = "audit-warn";
    return '<span class="badge ' + cls + '" title="last_check: ' + esc(s.last_check || "-") + '">' + esc(s.last_status) + "</span>";
  }

  function card(s) {
    var badges = [];
    badges.push('<span class="badge host">' + esc(HOST_LABEL[s.host] || s.host) + "</span>");
    var authLabel = AUTH_LABEL[s.auth];
    if (authLabel) badges.push('<span class="badge auth">' + esc(authLabel) + "</span>");
    var ab = auditBadge(s);
    if (ab) badges.push(ab);

    var nameHtml = s.url
      ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + "</a>"
      : esc(s.name);

    var ageHtml = "";
    if (s.age_days !== null && s.age_days !== undefined) {
      ageHtml = (s.stale ? '<span class="stale">' : "<span>") + s.last_deploy + " (" + s.age_days + "日前)" + "</span>";
    } else if (s.last_deploy) {
      ageHtml = "<span>" + esc(s.last_deploy) + "</span>";
    } else {
      ageHtml = "<span>未デプロイ</span>";
    }

    var deployHtml = s.deploy_cmd
      ? '<div class="card-deploy">deploy_cmd<code>' + esc(s.deploy_cmd) + "</code></div>"
      : "";

    var notesHtml = s.notes
      ? '<div class="card-notes">' + esc(s.notes) + "</div>"
      : "";

    var searchBlob = [s.name, s.slug, s.purpose, s.notes].join(" ").toLowerCase();

    return (
      '<div class="card" data-search="' + esc(searchBlob) + '">' +
        '<div class="card-head">' +
          '<div class="card-name">' + nameHtml + "</div>" +
          '<div class="card-slug">' + esc(s.slug) + "</div>" +
        "</div>" +
        '<div class="card-purpose">' + esc(s.purpose || "") + "</div>" +
        '<div class="badges">' + badges.join("") + "</div>" +
        deployHtml +
        '<div class="card-foot">' + ageHtml + "</div>" +
        notesHtml +
      "</div>"
    );
  }

  var main = document.getElementById("hub-main");
  var html = "";
  GROUPS.forEach(function (g) {
    var items = services.filter(g.match);
    if (!items.length) return;
    html +=
      '<section class="group" data-group="' + g.key + '">' +
        '<div class="group-title">' + g.label + " (" + items.length + ")</div>" +
        '<div class="cards">' + items.map(card).join("") + "</div>" +
      "</section>";
  });
  main.innerHTML = html || '<div class="empty-state">サービスがありません</div>';

  var search = document.getElementById("search");
  search.addEventListener("input", function () {
    var q = search.value.trim().toLowerCase();
    var anyVisibleByGroup = {};
    document.querySelectorAll(".card").forEach(function (el) {
      var match = !q || el.getAttribute("data-search").indexOf(q) !== -1;
      el.classList.toggle("hidden", !match);
      if (match) {
        var group = el.closest(".group");
        if (group) anyVisibleByGroup[group.getAttribute("data-group")] = true;
      }
    });
    document.querySelectorAll(".group").forEach(function (g) {
      g.classList.toggle("hidden", !anyVisibleByGroup[g.getAttribute("data-group")]);
    });
  });
})();
</script>
