<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#27415f">
<meta name="robots" content="noindex,nofollow"><title>仕様の確認</title>
<style>
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.gatewrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#27415f}
.gatebox{background:#fff;border-radius:10px;padding:26px 22px;width:min(88vw,340px);text-align:center;color:#1D2530}
.gatebox h2{margin:0;font-size:16px}
.gatebox input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:6px;border:1px solid #D5DBE2;font-size:16px;margin:12px 0 10px}
.gatebox button{width:100%;padding:10px;border-radius:6px;border:0;background:#27415f;color:#fff;font-size:15px;font-weight:600}
#pwerr{color:#B3261E;font-size:12px;min-height:16px;margin-top:8px}.hint{font-size:10.5px;color:#5A6776}
</style></head><body>
<div id="gate" class="gatewrap"><div class="gatebox"><h2>仕様の確認</h2>
<input id="pwin" type="password" placeholder="パスワード" autocomplete="current-password"><button id="pwbtn">開く</button>
<div id="pwerr"></div><div class="hint">URL とパスワードを知る人だけが閲覧できます · 約 0.7MB</div></div></div>
<script>
const _S=Uint8Array.from(atob("gHmt9g8KYxpR0xkL+DnrzQ=="),c=>c.charCodeAt(0));
const _I=Uint8Array.from(atob("vy225xl/bzvMKGrQ"),c=>c.charCodeAt(0));
const _IT=210000, _LSK="storystock_session", _FALLBACK="mediadb_session";
async function _data(){
  const r=await fetch("data.bin",{cache:"no-cache"});
  if(!r.ok) throw new Error("fetch "+r.status);
  return new Uint8Array(await r.arrayBuffer());
}
async function _decrypt(pw){
  const ek=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:_S,iterations:_IT,hash:"SHA-256"},ek,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:_I},k,await _data()));
}
async function _tryOpen(pw,silent){
  const el=document.getElementById("pwerr");
  try{
    el.textContent="読み込み中…";
    const html=new TextDecoder().decode(await _decrypt(pw));
    try{localStorage.setItem(_LSK,pw);}catch(e){}
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){
    if(String(e).indexOf("fetch")>=0){ el.textContent="読み込めませんでした (通信を確認して再読み込み)"; return false; }
    if(silent){ try{localStorage.removeItem(_LSK);}catch(_){} el.textContent=""; }
    else el.textContent="パスワードが違います";
    return false;
  }
}
(async()=>{
  let saved=null;
  try{saved=localStorage.getItem(_LSK)||(_FALLBACK?localStorage.getItem(_FALLBACK):null);}catch(e){}
  if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){const m=location.hash.match(/pw=([^&]+)/); if(m) saved=decodeURIComponent(m[1]);}
  if(saved && await _tryOpen(saved,true)) return;
  document.getElementById("pwbtn").onclick=()=>_tryOpen(document.getElementById("pwin").value,false);
  document.getElementById("pwin").addEventListener("keydown",e=>{if(e.key==="Enter")_tryOpen(document.getElementById("pwin").value,false);});
})();
</script></body></html>
